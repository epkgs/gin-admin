definitions:
  dto.AuthUpdatePasswordReq:
    properties:
      newPassword:
        description: New password (md5 hash)
        type: string
      oldPassword:
        description: Old password (md5 hash)
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.AuthUpdateUserReq:
    properties:
      email:
        description: Email of user
        maxLength: 128
        type: string
      nickName:
        description: Name of user
        maxLength: 64
        type: string
      phone:
        description: Phone number of user
        maxLength: 32
        type: string
      wechat:
        description: Wechat account
        maxLength: 64
        type: string
    type: object
  dto.Captcha:
    properties:
      captchaId:
        description: Captcha ID
        type: string
    type: object
  dto.List-po_Logger:
    properties:
      items:
        items:
          $ref: '#/definitions/po.Logger'
        type: array
      limit:
        description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        type: integer
      page:
        description: pagination index. default(1)
        type: integer
      total:
        description: total number of items
        type: integer
    type: object
  dto.List-po_Menu:
    properties:
      items:
        items:
          $ref: '#/definitions/po.Menu'
        type: array
      limit:
        description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        type: integer
      page:
        description: pagination index. default(1)
        type: integer
      total:
        description: total number of items
        type: integer
    type: object
  dto.List-po_Role:
    properties:
      items:
        items:
          $ref: '#/definitions/po.Role'
        type: array
      limit:
        description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        type: integer
      page:
        description: pagination index. default(1)
        type: integer
      total:
        description: total number of items
        type: integer
    type: object
  dto.List-po_User:
    properties:
      items:
        items:
          $ref: '#/definitions/po.User'
        type: array
      limit:
        description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        type: integer
      page:
        description: pagination index. default(1)
        type: integer
      total:
        description: total number of items
        type: integer
    type: object
  dto.Login:
    properties:
      password:
        description: Login password (md5 hash)
        type: string
      username:
        description: Login name
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginToken:
    properties:
      accessToken:
        description: Access token (JWT)
        type: string
      expires:
        description: Expired time (second)s
        type: integer
      refreshToken:
        description: Refresh token (JWT)
        type: string
      tokenType:
        description: 'Token type (Usage: Authorization=${token_type} ${access_token})'
        type: string
    type: object
  dto.MenuCreateReq:
    properties:
      component:
        description: Component path of view
        type: string
      extra:
        additionalProperties: {}
        description: Extras
        type: object
      method:
        description: Http method of resource
        type: string
      name:
        description: Display name of menu
        maxLength: 128
        type: string
      parentId:
        description: Parent ID (From Menu.ID)
        type: string
      path:
        description: Access path of menu
        type: string
      rank:
        description: Rank for sorting (Order by desc)
        type: integer
      redirect:
        description: Redirect path of menu
        type: string
      status:
        description: Status of menu (enabled, disabled)
        enum:
        - disabled
        - enabled
        type: string
      title:
        description: Menu title
        type: string
      type:
        description: Type of menu (catalog menu, button)
        enum:
        - catalog
        - menu
        - button
        type: string
    required:
    - status
    - type
    type: object
  dto.MenuUpdateReq:
    properties:
      component:
        description: Component path of view
        type: string
      extra:
        additionalProperties: {}
        description: Meta of menu (JSON)
        type: object
      method:
        description: Http method of resource
        type: string
      name:
        description: Display name of menu
        maxLength: 128
        type: string
      parentId:
        description: Parent ID (From Menu.ID)
        type: string
      path:
        description: Access path of menu
        type: string
      rank:
        description: Rank for sorting (Order by desc)
        type: integer
      status:
        description: Status of menu (enabled, disabled)
        enum:
        - disabled
        - enabled
        type: string
      title:
        description: Menu title
        type: string
      type:
        description: Type of menu (catalog menu, button)
        enum:
        - catalog
        - menu
        - button
        type: string
    type: object
  dto.Result-any:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.Result-dto_Captcha:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Captcha'
      message:
        type: string
    type: object
  dto.Result-dto_LoginToken:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.LoginToken'
      message:
        type: string
    type: object
  dto.Result-po_Menu:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/po.Menu'
      message:
        type: string
    type: object
  dto.Result-po_Menus:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/po.Menu'
        type: array
      message:
        type: string
    type: object
  dto.Result-po_Role:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/po.Role'
      message:
        type: string
    type: object
  dto.Result-po_User:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/po.User'
      message:
        type: string
    type: object
  dto.ResultList-po_Logger:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.List-po_Logger'
      message:
        type: string
    type: object
  dto.ResultList-po_Menu:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.List-po_Menu'
      message:
        type: string
    type: object
  dto.ResultList-po_Role:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.List-po_Role'
      message:
        type: string
    type: object
  dto.ResultList-po_User:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.List-po_User'
      message:
        type: string
    type: object
  dto.RoleCreateReq:
    properties:
      code:
        description: Code of role (unique)
        maxLength: 32
        type: string
      description:
        description: Details about role
        type: string
      menuIds:
        description: Menu ids
        items:
          type: string
        type: array
      name:
        description: Display name of role
        maxLength: 128
        type: string
      rank:
        description: Rank for sorting
        type: integer
      status:
        description: Status of role (enabled, disabled)
        enum:
        - disabled
        - enabled
        type: string
    required:
    - code
    - name
    - status
    type: object
  dto.RoleUpdateReq:
    properties:
      code:
        description: Code of role (unique)
        maxLength: 32
        type: string
      description:
        description: Details about role
        type: string
      menuIds:
        description: Menu ids
        items:
          type: string
        type: array
      name:
        description: Display name of role
        maxLength: 128
        type: string
      rank:
        description: Rank for sorting
        type: integer
      status:
        description: Status of role (enabled, disabled)
        enum:
        - disabled
        - enabled
        type: string
    type: object
  dto.UserCreateReq:
    properties:
      description:
        description: Description of user
        maxLength: 1024
        type: string
      email:
        description: Email of user
        maxLength: 128
        type: string
      nickName:
        description: Name of user
        maxLength: 64
        type: string
      password:
        description: Password for login (md5 hash)
        maxLength: 64
        type: string
      phone:
        description: Phone number of user
        maxLength: 32
        type: string
      realName:
        description: Real name of user
        maxLength: 64
        type: string
      roleIds:
        description: Roles of user
        items:
          type: string
        type: array
      status:
        description: Status of user (activated, freezed)
        enum:
        - activated
        - freezed
        type: string
      username:
        description: Username for login
        maxLength: 64
        type: string
      wechat:
        description: Wechat account
        maxLength: 64
        type: string
    required:
    - nickName
    - roleIds
    - status
    - username
    type: object
  dto.UserUpdateReq:
    properties:
      description:
        description: Description of user
        maxLength: 1024
        type: string
      email:
        description: Email of user
        maxLength: 128
        type: string
      nickName:
        description: Name of user
        maxLength: 64
        type: string
      password:
        description: Password for login (md5 hash)
        maxLength: 64
        type: string
      phone:
        description: Phone number of user
        maxLength: 32
        type: string
      realName:
        description: Real name of user
        maxLength: 64
        type: string
      roleIds:
        description: Roles of user
        items:
          type: string
        type: array
      status:
        description: Status of user (activated, freezed)
        enum:
        - activated
        - freezed
        type: string
      username:
        description: Username for login
        maxLength: 64
        type: string
      wechat:
        description: Wechat account
        maxLength: 64
        type: string
    type: object
  po.Logger:
    properties:
      createdAt:
        description: Create time
        type: string
      id:
        description: Unique ID
        type: string
      level:
        description: Log level
        type: string
      message:
        description: Log message
        type: string
      meta:
        additionalProperties: {}
        description: Log data
        type: object
      nickName:
        description: From User.NickName
        type: string
      stack:
        description: Error stack
        type: string
      tag:
        description: Log tag
        type: string
      traceId:
        description: Trace ID
        type: string
      userId:
        description: User ID
        type: string
      username:
        description: From User.Name
        type: string
    type: object
  po.Menu:
    properties:
      children:
        allOf:
        - $ref: '#/definitions/po.Menus'
        description: Child menus
      component:
        description: Component path of view
        type: string
      createdAt:
        description: Create time
        type: string
      extra:
        additionalProperties: {}
        description: Extra data for frontend
        type: object
      id:
        description: Unique ID
        type: string
      method:
        description: Http method of resource
        type: string
      name:
        description: Display name of menu
        type: string
      parentId:
        description: Parent ID (From Menu.ID)
        type: string
      path:
        description: Access path of menu
        type: string
      rank:
        description: Rank for sorting (Order by desc)
        type: integer
      redirect:
        description: Redirect path of menu
        type: string
      roles:
        $ref: '#/definitions/po.Roles'
      status:
        description: Status of menu (enabled, disabled)
        type: string
      title:
        description: Menu title
        type: string
      type:
        description: Type of menu (catalog, menu, button)
        type: string
      updatedAt:
        description: Update time
        type: string
    type: object
  po.Menus:
    items:
      $ref: '#/definitions/po.Menu'
    type: array
  po.Role:
    properties:
      code:
        description: Code of role (unique)
        type: string
      createdAt:
        description: Create time
        type: string
      description:
        description: Details about role
        type: string
      id:
        description: Unique ID
        type: string
      menus:
        items:
          $ref: '#/definitions/po.Menu'
        type: array
      name:
        description: Display name of role
        type: string
      rank:
        description: Rank for sorting
        type: integer
      status:
        description: Status of role (disabled, enabled)
        type: string
      updatedAt:
        description: Update time
        type: string
      users:
        items:
          $ref: '#/definitions/po.User'
        type: array
    type: object
  po.Roles:
    items:
      $ref: '#/definitions/po.Role'
    type: array
  po.User:
    properties:
      avatar:
        description: Avatar URL
        type: string
      createdAt:
        description: Create time
        type: string
      description:
        description: Details about user
        type: string
      email:
        description: Email of user
        type: string
      id:
        description: Unique ID
        type: string
      nickName:
        description: Name of user
        type: string
      phone:
        description: Phone number of user
        type: string
      realName:
        description: Real name of user
        type: string
      roles:
        description: Roles of user
        items:
          $ref: '#/definitions/po.Role'
        type: array
      status:
        description: Status of user (activated, freezed)
        type: string
      updatedAt:
        description: Update time
        type: string
      username:
        description: Username for login
        type: string
      wechat:
        description: Wechat account
        type: string
    type: object
info:
  contact: {}
  description: 基于 Gin 的快速启动项目
  title: Gin Admin
  version: v1.0.0
paths:
  /api/v1/auth/login:
    post:
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.Login'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-dto_LoginToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      summary: Login system with username and password
      tags:
      - AuthAPI
  /api/v1/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Logout system
      tags:
      - AuthAPI
  /api/v1/auth/menus:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-po_Menus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Query current user menus based on the current user role
      tags:
      - AuthAPI
  /api/v1/auth/password:
    put:
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AuthUpdatePasswordReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Result-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Change current user password
      tags:
      - AuthAPI
  /api/v1/auth/refresh-token:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-dto_LoginToken'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Refresh current access token
      tags:
      - AuthAPI
  /api/v1/auth/user:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-po_User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Get current user info
      tags:
      - AuthAPI
    put:
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AuthUpdateUserReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Result-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Update current user info
      tags:
      - AuthAPI
  /api/v1/captcha/id:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-dto_Captcha'
      summary: Get captcha ID
      tags:
      - CaptchaAPI
  /api/v1/captcha/image:
    get:
      parameters:
      - description: Captcha ID
        in: query
        name: id
        type: string
      - description: Reload captcha image (reload=1)
        in: query
        name: reload
        type: boolean
      produces:
      - image/png
      responses:
        "200":
          description: Captcha image
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Result-any'
      summary: Response captcha image
      tags:
      - CaptchaAPI
  /api/v1/loggers:
    get:
      parameters:
      - description: end time
        in: query
        name: endTime
        type: string
      - description: log level
        in: query
        name: level
        type: string
      - description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        in: query
        name: limit
        type: integer
      - description: log message
        in: query
        name: message
        type: string
      - description: pagination index. default(1)
        in: query
        name: page
        type: integer
      - description: start time
        in: query
        name: startTime
        type: string
      - description: log tag
        in: query
        name: tag
        type: string
      - description: total number of items
        in: query
        name: total
        type: integer
      - description: trace ID
        in: query
        name: traceID
        type: string
      - description: user name
        in: query
        name: username
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResultList-po_Logger'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Query logger list
      tags:
      - LoggerAPI
  /api/v1/menus:
    get:
      parameters:
      - description: Role ID
        in: query
        name: '-'
        type: string
      - description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        in: query
        name: limit
        type: integer
      - description: Display name of menu
        in: query
        name: name
        type: string
      - description: pagination index. default(1)
        in: query
        name: page
        type: integer
      - description: Status of menu (disabled, enabled)
        in: query
        name: status
        type: string
      - description: total number of items
        in: query
        name: total
        type: integer
      - description: Type of menu (catalog, menu, button)
        in: query
        name: type
        type: string
      - description: Include resources
        in: query
        name: withResources
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResultList-po_Menu'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Query menu tree data
      tags:
      - MenuAPI
    post:
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.MenuCreateReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-po_Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Result-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Create menu record
      tags:
      - MenuAPI
  /api/v1/menus/{id}:
    delete:
      parameters:
      - description: unique id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Delete menu record by ID
      tags:
      - MenuAPI
    get:
      parameters:
      - description: unique id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-po_Menu'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Get menu record by ID
      tags:
      - MenuAPI
    put:
      parameters:
      - description: unique id
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.MenuUpdateReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Result-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Result-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Result-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Result-any'
      security:
      - ApiKeyAuth: []
      summary: Update menu record by ID
      tags:
      - MenuAPI
  /api/v1/roles:
    get:
      parameters:
      - description: pagination size, less than 0 is considered as unlimited quantity.
          default(20)
        in: query
        name: limit
        type: integer
      - description: Display name of role
